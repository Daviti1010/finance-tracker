name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server dependencies
        working-directory: ./server
        run: npm install

      - name: Set up database schema
        working-directory: ./server
        run: psql -h localhost -U postgres -d finance_tracker_test -f db/schema.sql
        env:
          PGPASSWORD: postgres

      - name: Run tests
        working-directory: ./server
        run: npm test
        env:
          HOST: localhost
          PORT: 5432
          USER: postgres
          PASSWORD: postgres
          DATABASE: finance_tracker_test
          JWT_SECRET: test_secret_value
          RESEND_API_KEY: re_test_placeholder_key